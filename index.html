<script>
const BASE="https://mhtjgbcewfnmnsvvgnli.supabase.co";
const KEY="sb_publishable_0ozDkEkihNyFxsLf7Zegyw_M9NiCp9q";
const $=i=>document.getElementById(i);
const CATS=[["🎨","Design"],["✍️","Writing"],["💻","Programming"],["🎬","Video"],["📣","Marketing"],["🎵","Music"],["📊","Business"],["📷","Photo"]];
const ICON={};CATS.forEach(c=>ICON[c[1]]=c[0]);
const SV=[["Modern logo design for your brand","Design","Amaka O.",15,"4.9","🎨"],["SEO blog articles that rank","Writing","Tunde A.",20,"4.8","✍️"],["Responsive business website","Programming","Chinedu E.",80,"5.0","💻"],["Short video editing for social media","Video","Zainab K.",30,"4.9","🎬"],["Social media ad campaign setup","Marketing","Ife B.",40,"4.7","📣"],["Voice-over for ads and explainers","Music","Sam D.",25,"4.8","🎵"],["Business plan and pitch deck","Business","Ngozi P.",60,"4.9","📊"],["Product photo retouching","Photo","Dayo L.",12,"4.8","📷"]];
const FR=[["Amaka O.","Brand designer","4.9"],["Chinedu E.","Web developer","5.0"],["Zainab K.","Video editor","4.9"],["Tunde A.","Content writer","4.8"]];
let cat="",q="",mode="login",session=null,REAL=[],cur=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function drawCats(){$("cats").innerHTML=CATS.map(c=>'<button class="cat'+(cat===c[1]?" on":"")+'" data-c="'+c[1]+'"><span>'+c[0]+'</span>'+c[1]+'</button>').join("");
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=cat===b.dataset.c?"":b.dataset.c;drawCats();drawSv();$("svs").scrollIntoView({behavior:"smooth"})});}
function drawSv(){const real=REAL.length>0,base=real?REAL:SV;
  const l=[];base.forEach((s,i)=>{if((!cat||s[1]===cat)&&(!q||(s[0]+" "+s[1]+" "+s[2]).toLowerCase().includes(q)))l.push([s,i])});
  $("note").classList.toggle("hide",real);
  $("sv").innerHTML=l.length?l.map(x=>{const s=x[0];return'<div class="card"'+(real?' data-i="'+x[1]+'"':'')+'><div class="th">'+s[5]+'</div><div class="ci"><b>'+esc(s[0])+'</b><div class="sm">'+esc(s[2])+' · ★ '+esc(s[4])+'</div><div class="pr">From $'+esc(s[3])+'</div></div></div>'}).join(""):'<p class="sm">No services match yet. Try another word.</p>';
  document.querySelectorAll(".card[data-i]").forEach(c=>c.onclick=()=>openSvc(+c.dataset.i));}
function drawFr(){$("fr").innerHTML=FR.map(f=>'<div class="fc"><div class="av">'+f[0][0]+'</div><b>'+f[0]+'</b><div class="sm">'+f[1]+'</div><div class="sm">★ '+f[2]+'</div></div>').join("");}
function doSearch(){q=$("q").value.trim().toLowerCase();drawSv();$("svs").scrollIntoView({behavior:"smooth"});}
$("sb").onclick=doSearch;$("q").onkeydown=e=>{if(e.key==="Enter")doSearch()};

async function api(path,opts,token){const h={apikey:KEY,"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;
  const r=await fetch(BASE+path,Object.assign({},opts||{},{headers:h}));let d=null;try{d=await r.json()}catch(e){}return{ok:r.ok,data:d}}
function errText(d){const m=d&&(d.msg||d.error_description||d.message);if(m&&/jwt expired/i.test(m))return"Your login expired. Please log out and log in again.";return m||"Something went wrong. Please try again."}
async function loadSv(){const r=await api("/rest/v1/services?select=id,title,category,price_usd,description,freelancer_id,profiles(full_name)&is_active=eq.true&order=created_at.desc&limit=60");
  REAL=r.ok&&Array.isArray(r.data)?r.data.map(x=>[x.title,x.category,(x.profiles&&x.profiles.full_name)||"Freelancer",x.price_usd,"New",ICON[x.category]||"⭐",x.id,x.description,x.freelancer_id]):[];drawSv()}

function say(t,ok){const m=$("msg");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
function setMode(m){mode=m;$("tabLogin").classList.toggle("on",m==="login");$("tabReg").classList.toggle("on",m==="register");$("regOnly").classList.toggle("hide",m==="login");$("go").textContent=m==="login"?"Log in":"Create account";say("")}
function openM(m){setMode(m);$("md").classList.add("on")}
$("openLogin").onclick=()=>openM("login");$("openJoin").onclick=()=>openM("register");
$("tabLogin").onclick=()=>setMode("login");$("tabReg").onclick=()=>setMode("register");
$("cl").onclick=()=>$("md").classList.remove("on");

function store(s){try{localStorage.setItem("rm_session",JSON.stringify(s))}catch(e){}}
function recall(){try{return JSON.parse(localStorage.getItem("rm_session"))}catch(e){return null}}
function forget(){try{localStorage.removeItem("rm_session")}catch(e){}}

async function showUser(s){
  const r=await api("/rest/v1/profiles?id=eq."+s.user.id+"&select=full_name,role",{},s.access_token);
  if(!r.ok){forget();return false}
  const p=r.data&&r.data[0];session=s;
  $("guest").classList.add("hide");$("user").classList.remove("hide");
  $("dash").classList.toggle("hide",!(p&&p.role==="freelancer"));
  const n=(p&&p.full_name)||s.user.email;
  $("hi").textContent="Hi, "+n.split(" ")[0];
  return true}

$("go").onclick=async()=>{
  const email=$("email").value.trim(),password=$("password").value,full_name=$("fullName").value.trim();
  if(!email||password.length<6){say("Enter your email and a password of at least 6 characters.");return}
  if(mode==="register"&&!full_name){say("Enter your full name.");return}
  $("go").disabled=true;say("Please wait...",true);
  try{
    let r;
    if(mode==="register"){r=await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email:email,password:password,data:{full_name:full_name,role:$("role").value}})})}
    else{r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email,password:password})})}
    if(!r.ok){say(errText(r.data));return}
    if(r.data&&r.data.access_token){const s={access_token:r.data.access_token,user:r.data.user};store(s);
      if(await showUser(s)){$("md").classList.remove("on");$("password").value=""}else say("Signed in, but your profile could not be loaded.")}
    else{say("Account created. Check your email to confirm it, then log in.",true);setMode("login")}
  }catch(e){say("Could not reach the server. Check your connection and try again.")}
  finally{$("go").disabled=false}};

$("out").onclick=async()=>{try{if(session)await api("/auth/v1/logout",{method:"POST"},session.access_token)}catch(e){}
  forget();session=null;$("dm").classList.remove("on");$("xm").classList.remove("on");$("user").classList.add("hide");$("guest").classList.remove("hide")};

function dmsg(t,ok){const m=$("dmsg");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
async function myList(){
  const r=await api("/rest/v1/services?freelancer_id=eq."+session.user.id+"&select=id,title,price_usd&order=created_at.desc",{},session.access_token);
  $("mine").innerHTML=r.ok&&r.data.length?r.data.map(s=>'<div class="row"><span>'+esc(s.title)+' · $'+esc(s.price_usd)+'</span><button class="b del" data-id="'+esc(s.id)+'">Delete</button></div>').join(""):'<p class="sm">You have no services yet.</p>';
  document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{await api("/rest/v1/services?id=eq."+b.dataset.id,{method:"DELETE"},session.access_token);myList();loadSv()})}
$("dash").onclick=()=>{dmsg("");$("dm").classList.add("on");myList()};
$("dcl").onclick=()=>$("dm").classList.remove("on");
$("pub").onclick=async()=>{
  const t=$("sTitle").value.trim(),d=$("sDesc").value.trim(),p=parseFloat($("sPrice").value);
  if(t.length<5||d.length<20||!(p>=5)){dmsg("Title needs 5+ characters, description 20+, and price $5 or more.");return}
  $("pub").disabled=true;dmsg("Publishing...",true);
  try{
    const r=await api("/rest/v1/services",{method:"POST",body:JSON.stringify({title:t,category:$("sCat").value,description:d,price_usd:p})},session.access_token);
    if(r.ok){$("sTitle").value="";$("sDesc").value="";$("sPrice").value="";dmsg("Published. Your service now appears on the homepage.",true);myList();loadSv()}
    else dmsg(errText(r.data));
  }catch(e){dmsg("Could not reach the server. Try again.")}
  finally{$("pub").disabled=false}};

function omsg(t,ok){const m=$("omsg");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
function openSvc(i){cur=REAL[i];if(!cur)return;
  $("dT").textContent=cur[0];$("dM").textContent=cur[2]+" · "+cur[1];$("dP").textContent="$"+cur[3];$("dD").textContent=cur[7]||"";
  $("oNote").value="";omsg("");$("om").classList.add("on")}
$("ocl").onclick=()=>$("om").classList.remove("on");
$("ord").onclick=async()=>{
  if(!session){$("om").classList.remove("on");openM("login");return}
  if(session.user.id===cur[8]){omsg("This is your own service.");return}
  $("ord").disabled=true;omsg("Placing your order...",true);
  try{
    const r=await api("/rest/v1/orders",{method:"POST",body:JSON.stringify({service_id:cur[6],note:$("oNote").value.trim()||null})},session.access_token);
    if(r.ok)omsg("Order placed. Track it under My orders.",true);else omsg(errText(r.data));
  }catch(e){omsg("Could not reach the server. Try again.")}
  finally{$("ord").disabled=false}};

function xmsg(t){const m=$("xmsg");m.textContent=t;m.className="msg err"}
function actions(o){
  const me=session.user.id,buyer=o.buyer_id===me,a=[];
  if(!buyer){
    if(o.status==="pending"){a.push(["accepted","Accept",""]);a.push(["cancelled","Decline","no"])}
    else if(o.status==="accepted")a.push(["delivered","Mark delivered",""]);
  }else{
    if(o.status==="pending")a.push(["cancelled","Cancel order","no"]);
    else if(o.status==="delivered")a.push(["completed","Mark completed",""]);
  }
  return a.length?'<div class="acts">'+a.map(x=>'<button class="b act '+(x[2]||"p")+'" data-id="'+esc(o.id)+'" data-s="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>':""}
async function loadOrders(){
  const r=await api("/rest/v1/orders?select=id,service_title,price_usd,status,created_at,buyer_id,note&order=created_at.desc&limit=50",{},session.access_token);
  if(!r.ok){$("olist").innerHTML='<p class="sm">'+esc(errText(r.data))+'</p>';return}
  $("olist").innerHTML=r.data.length?r.data.map(o=>'<div class="row" style="align-items:flex-start"><span><b>'+esc(o.service_title)+'</b><br><span class="sm">'+(o.buyer_id===session.user.id?"You ordered":"Ordered from you")+' · $'+esc(o.price_usd)+' · '+esc(new Date(o.created_at).toLocaleDateString())+(o.note?'<br>Note: '+esc(o.note):'')+'</span>'+actions(o)+'</span><span class="st">'+esc(o.status)+'</span></div>').join(""):'<p class="sm">No orders yet.</p>';
  document.querySelectorAll(".act").forEach(b=>b.onclick=async()=>{
    b.disabled=true;$("xmsg").textContent="";
    try{
      const u=await api("/rest/v1/orders?id=eq."+b.dataset.id,{method:"PATCH",body:JSON.stringify({status:b.dataset.s})},session.access_token);
      if(!u.ok)xmsg(errText(u.data));
    }catch(e){xmsg("Could not reach the server. Try again.")}
    loadOrders()})}
$("ords").onclick=()=>{$("xmsg").textContent="";$("olist").innerHTML='<p class="sm">Loading...</p>';$("xm").classList.add("on");loadOrders()};
$("xcl").onclick=()=>$("xm").classList.remove("on");

$("sCat").innerHTML=CATS.map(c=>"<option>"+c[1]+"</option>").join("");
drawCats();drawSv();drawFr();loadSv();
const saved=recall();if(saved&&saved.access_token&&saved.user)showUser(saved);
</script>
</body>
</html>
